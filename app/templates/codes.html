{% extends 'base.html' %}{% block content %}<section class="card"><h1>Giriş kodları</h1><p class="warning">Kodlar yalnızca bu sayfada gösterilir. Şimdi güvenli bir yere kopyalayıp kişilere ayrı ayrı iletin. Sayfadan ayrılınca tekrar görüntülenemez.</p><p>Paylaşılan toplu listeyi gizli tutun.</p><textarea id="all-codes" rows="{{ codes|length + 1 }}" readonly>{% for name, code in codes %}{{ name }}: {{ code }}
{% endfor %}</textarea><button type="button" onclick="copyCodes()">Tümünü kopyala</button><p id="copy-status" role="status"></p><a href="/admin">Yönetime dön</a></section><script>async function copyCodes(){try{await navigator.clipboard.writeText(document.getElementById('all-codes').value);document.getElementById('copy-status').textContent='Kopyalandı.'}catch(e){document.getElementById('all-codes').select();document.getElementById('copy-status').textContent='Metin seçildi; elle kopyalayın.'}}</script>{% endblock %}
